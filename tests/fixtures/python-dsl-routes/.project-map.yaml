project:
  name: routed
  language: python

repository_identity: sample/routed

sections:
  - metadata

analysis_unit:
  sources:
    include: ["**/*.py"]

detect:
  inbound:
    routers:
      - dsl: "sendr_aiohttp.PrefixedUrl"
        path_arg: { kind: arg, selector: 0 }
        prefix_from: { kind: class_const, selector: "PREFIX" }
        verb_from:
          kind: handler_methods
          handler: { kind: arg, selector: 1 }
      - dsl: "sendr_aiohttp.Url"
        path_arg: { kind: arg, selector: 0 }
        verb_from:
          kind: handler_methods
          handler: { kind: arg, selector: 1 }
      - dsl: "sendr_aiohttp.ShiftedUrl"
        path_arg: { kind: arg, selector: 1 }
        verb_from:
          kind: handler_methods
          handler: { kind: arg, selector: 2 }

output:
  markdown: PROJECT_MAP.md
  facts: .project-map/facts.json
