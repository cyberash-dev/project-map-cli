project:
  name: go-openapi-drift
  language: go

repository_identity: sample/go-openapi-drift

sections: []

analysis_unit:
  sources:
    include: ["**/*.go"]

openapi:
  serves:
    - spec: repo:openapi/api.yaml
      contract_id: sample.drift.v1

detect:
  inbound:
    serve_roots:
      - function: "internal/api.Build"
        result: 0
        mount: "/api"
    routers:
      - dsl: "github.com/go-chi/chi/v5"
        path_arg: { kind: arg, selector: 0 }
        identity_preserving: []

output:
  markdown: PROJECT_MAP.md
  facts: .project-map/facts.json
