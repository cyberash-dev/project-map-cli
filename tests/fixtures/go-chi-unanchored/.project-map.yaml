project:
  name: go-chi-unanchored
  language: go

repository_identity: sample/go-chi-unanchored

sections: []

analysis_unit:
  sources:
    include: ["**/*.go"]

openapi:
  serves:
    - spec: repo:openapi/api.yaml
      contract_id: sample.unanchored.v1

detect:
  inbound:
    routers:
      - dsl: "github.com/go-chi/chi/v5"
        path_arg: { kind: arg, selector: 0 }
        identity_preserving: []

output:
  markdown: PROJECT_MAP.md
  facts: .project-map/facts.json
